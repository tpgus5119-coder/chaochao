<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="짜오짜오">
<meta name="mobile-web-app-capable" content="yes">
<title>짜오짜오 — 베트남어</title>
<link rel="stylesheet" href="style.css?v=c812bb64">
</head>
<body>

<header id="top">
  <button id="back" class="ghost" hidden>‹</button>
  <h1 id="title">짜오짜오</h1>
  <button id="region" class="ghost" title="북부/남부 소리 전환">북부</button>
  <button id="voice" class="ghost" title="목소리 바꾸기">여</button>
</header>

<main>
  <!-- 홈 -->
  <section id="home" class="view">
    <div id="plan" class="plan"></div>
    <div id="progress" class="progress"></div>
    <div class="menu">
      <div class="mtile wide">
        <b>하루 5분 베트남어</b>
        <div class="mbtns"><button id="goDaily" class="ghost">일상</button><button id="goWork" class="ghost">직무</button></div>
      </div>
      <div class="mtile">
        <b>기본기</b>
        <div class="mbtns"><button id="goVowelE" class="ghost">모음</button><button id="goCons" class="ghost">자음</button><button id="goTone" class="ghost">성조</button><button class="ghost" data-rule="0">호칭</button><button class="ghost" data-rule="1">어순</button><button class="ghost" data-rule="2">단위</button><button class="ghost" data-rule="3">남부 소리</button></div>
      </div>
      <div class="mtile">
        <b>복습</b>
        <div class="mbtns"><button id="goReview" class="ghost">복습</button><button id="goQuick" class="ghost">3분만</button><button id="goFlash" class="ghost">훑기</button><button id="goTalk" class="ghost">대화</button><button id="goSpeak" class="ghost">따라 말하기</button><button id="goWrite" class="ghost">손글씨</button><button id="goType" class="ghost">타이핑</button><button id="goWeekly" class="ghost" hidden>이번 주 몰아서</button></div>
      </div>
      <div class="mtile">
        <b>AI 선생님</b>
        <div class="mbtns"><button id="goChat" class="ghost">대화하기</button></div>
      </div>
      <div class="mtile">
        <b>베트남 소식</b>
        <div class="mbtns"><button id="goNews" class="ghost">기사</button><button id="goWx" class="ghost">날씨</button><button id="goCulture" class="ghost">문화</button></div>
      </div>
      <div class="mtile">
        <b>사용법</b>
        <div class="mbtns"><button id="goGuide" class="ghost">보기</button></div>
      </div>
    </div>
    <div class="backup">
      <button id="bkExport" class="ghost">진도 백업</button>
      <button id="bkImport" class="ghost">백업 불러오기</button>
      <button id="bkReset" class="ghost">진도 초기화</button>
    </div>
    <p class="foot small">하루 학습이 끝나면 <b>진도 백업</b>을 한 번 눌러 두세요.</p>
  </section>

  <!-- 학습 -->
  <section id="learn" class="view" hidden>
    <div id="learnIntro" class="intro"></div>
    <div id="card" class="card"></div>
    <div class="pager">
      <button id="prev" class="ghost big">‹</button>
      <span id="pos"></span>
      <button id="next" class="primary big">다음 ›</button>
    </div>
  </section>

  <!-- 퀴즈 -->
  <section id="quiz" class="view" hidden>
    <div id="quizBar" class="bar"><div id="quizFill"></div></div>
    <div id="quizBody"></div>
  </section>

  <!-- 성조 드릴 -->
  <section id="tone" class="view" hidden>
    <div id="toneBody"></div>
  </section>

  <!-- 규칙 -->
  <section id="rules" class="view" hidden>
    <div id="rulesBody"></div>
  </section>

  <!-- 업적 -->
  <section id="award" class="view" hidden>
    <div id="awardBody"></div>
  </section>

  <!-- 학습 과정 목록 -->
  <section id="course" class="view" hidden>
    <ol id="dayList" class="days"></ol>
  </section>

  <!-- 따라 말하기 -->
  <section id="speak" class="view" hidden>
    <div id="speakBody"></div>
  </section>

  <!-- 자판 -->
  <section id="type" class="view" hidden>
    <div id="typeBody"></div>
  </section>

  <!-- 손글씨 -->
  <section id="write" class="view" hidden>
    <div id="writeBody"></div>
  </section>

  <!-- 베트남 소식 -->
  <section id="news" class="view" hidden>
    <div id="newsBody"></div>
  </section>

  <!-- 날씨 · 시간 -->
  <section id="wx" class="view" hidden>
    <div id="wxBody"></div>
  </section>

  <!-- 사용법 -->
  <section id="guide" class="view" hidden>
    <div id="guideBody"></div>
  </section>

  <!-- 주간 성적표 -->
  <section id="week" class="view" hidden>
    <div id="weekBody"></div>
  </section>

  <!-- 닉네임 -->
  <section id="nick" class="view" hidden>
    <div id="nickBody"></div>
  </section>

  <!-- 베트남 문화 -->
  <section id="culture" class="view" hidden>
    <div id="cultureBody"></div>
  </section>

  <!-- AI 대화 -->
  <section id="chat" class="view" hidden>
    <div id="tch" class="tch" hidden></div>
    <div id="chatSetup" hidden></div>
    <div id="chatLog" class="chatlog"></div>
    <form id="chatForm" class="chatin" hidden>
      <button id="chatCam" class="ghost" type="button" title="사진을 보여주며 대화">사진</button>
      <button id="chatMic" class="ghost" type="button" title="말로 대화">말로</button>
      <input id="chatText" type="text" placeholder="베트남어나 한국어로…" autocomplete="off">
      <button class="primary" type="submit">보내기</button>
    </form>
  </section>
</main>

<script src="pitch.js?v=c812bb64"></script>
<script src="app.js?v=c812bb64"></script>
</body>
</html>
