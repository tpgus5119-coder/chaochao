<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="베트남어">
<meta name="mobile-web-app-capable" content="yes">
<title>베트남어 스터디</title>
<link rel="stylesheet" href="style.css?v=e83f2dce">
</head>
<body>

<header id="top">
  <button id="back" class="ghost" hidden>‹</button>
  <h1 id="title">베트남어 스터디</h1>
  <button id="region" class="ghost" title="북부/남부 소리 전환">북부</button>
  <button id="voice" class="ghost" title="목소리 바꾸기">여</button>
</header>

<main>
  <!-- 홈 -->
  <section id="home" class="view">
    <p class="lede">하루 1세트 15분 — 일상 세트와 직무(봉제·공장) 세트를 번갈아. 완전 처음부터.</p>
    <button id="heroGo" class="hero" hidden></button>
    <div id="progress" class="progress"></div>
    <div class="menu">
      <div class="mtile wide">
        <b>학습 과정</b><span id="courseNote"></span>
        <div class="mbtns"><button id="goDaily" class="primary">일상 과정</button><button id="goWork" class="primary">직무 과정</button></div>
      </div>
      <div class="mtile">
        <b>성조 훈련</b><span id="toneWhy">소리만 듣고 6성조 구별</span>
        <div class="mbtns"><button id="goTone" class="primary">듣기</button><button id="goMark" class="ghost">부호 쓰기</button></div>
      </div>
      <div class="mtile">
        <b>복습</b><span id="revNote"></span>
        <div class="mbtns"><button id="goReview" class="primary">전부</button><button id="goQuick" class="ghost">3분만</button><button id="goWeekly" class="ghost" hidden>주간</button></div>
      </div>
      <div class="mtile">
        <b>말하기 · 듣기</b><span>원어민 곡선과 비교하며</span>
        <div class="mbtns"><button id="goSpeak" class="primary">따라 말하기</button><button id="goDict" class="ghost">받아쓰기</button></div>
      </div>
      <div class="mtile">
        <b>읽기 · 쓰기</b><span>손으로, 자판으로</span>
        <div class="mbtns"><button id="goWrite" class="primary">손글씨</button><button id="goType" class="ghost">자판</button></div>
      </div>
      <div class="mtile">
        <b>AI 대화</b><span>배운 문장으로 주고받기</span>
        <div class="mbtns"><button id="goChat" class="primary">대화</button></div>
      </div>
      <div class="mtile">
        <b>규칙</b><span>꼭 알아야 할 것 + 남부 차이</span>
        <div class="mbtns"><button id="goRules" class="primary">보기</button></div>
      </div>
    </div>
    <p class="foot">진도는 이 기기에만 저장됩니다. 신규는 다 같이, 복습은 각자.</p>
    <div class="backup">
      <button id="bkExport" class="ghost">진도 백업</button>
      <button id="bkImport" class="ghost">백업 불러오기</button>
    </div>
    <p class="foot small">아이폰은 앱을 몇 주 안 열면 저장된 진도를 지울 수 있습니다.
      가끔 <b>진도 백업</b>을 눌러 나온 글자를 메모장이나 단톡방에 붙여두세요.</p>
  </section>

  <!-- 학습 -->
  <section id="learn" class="view" hidden>
    <div id="learnIntro" class="intro"></div>
    <div id="card" class="card"></div>
    <div class="pager">
      <button id="prev" class="ghost big">‹</button>
      <span id="pos"></span>
      <button id="next" class="primary big">다음 ›</button>
    </div>
  </section>

  <!-- 퀴즈 -->
  <section id="quiz" class="view" hidden>
    <div id="quizBar" class="bar"><div id="quizFill"></div></div>
    <div id="quizBody"></div>
  </section>

  <!-- 성조 드릴 -->
  <section id="tone" class="view" hidden>
    <div id="toneBody"></div>
  </section>

  <!-- 규칙 -->
  <section id="rules" class="view" hidden>
    <div id="rulesBody"></div>
  </section>

  <!-- 성조 부호 -->
  <section id="mark" class="view" hidden>
    <div id="markBody"></div>
  </section>

  <!-- 학습 과정 목록 -->
  <section id="course" class="view" hidden>
    <ol id="dayList" class="days"></ol>
  </section>

  <!-- 따라 말하기 -->
  <section id="speak" class="view" hidden>
    <div id="speakBody"></div>
  </section>

  <!-- 손글씨 · 자판 -->
  <section id="write" class="view" hidden>
    <div id="writeBody"></div>
  </section>
  <section id="type" class="view" hidden>
    <div id="typeBody"></div>
  </section>

  <!-- AI 대화 -->
  <section id="chat" class="view" hidden>
    <div id="chatSetup" hidden></div>
    <div id="chatLog" class="chatlog"></div>
    <form id="chatForm" class="chatin" hidden>
      <input id="chatText" type="text" placeholder="베트남어나 한국어로…" autocomplete="off">
      <button class="primary" type="submit">보내기</button>
    </form>
  </section>
</main>

<script src="pitch.js?v=e83f2dce"></script>
<script src="app.js?v=e83f2dce"></script>
</body>
</html>
