<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="베트남어">
<meta name="mobile-web-app-capable" content="yes">
<title>베트남어 스터디</title>
<link rel="stylesheet" href="style.css?v=c25b3683">
</head>
<body>

<header id="top">
  <button id="back" class="ghost" hidden>‹</button>
  <h1 id="title">베트남어 스터디</h1>
  <button id="voice" class="ghost" title="목소리 바꾸기">여</button>
</header>

<main>
  <!-- 홈 -->
  <section id="home" class="view">
    <p class="lede">하루 15분. 단어 10개 + 문장 4개(일상 2·현장 2). 그리고 서로 대화 한 번.</p>
    <div class="banner tone">
      <div>
        <strong>성조 훈련</strong>
        <span>소리만 듣고 6성조 구별하기</span>
      </div>
      <button id="goTone" class="primary">연습</button>
    </div>
    <div id="reviewCard" class="banner" hidden>
      <div>
        <strong id="reviewCount"></strong>
        <span>복습할 차례입니다</span>
      </div>
      <button id="goReview" class="primary">복습</button>
    </div>
    <ol id="dayList" class="days"></ol>
    <p class="foot">진도는 이 기기에만 저장됩니다. 신규는 다 같이, 복습은 각자.</p>
    <div class="backup">
      <button id="bkExport" class="ghost">진도 백업</button>
      <button id="bkImport" class="ghost">백업 불러오기</button>
    </div>
    <p class="foot small">아이폰은 앱을 몇 주 안 열면 저장된 진도를 지울 수 있습니다.
      가끔 <b>진도 백업</b>을 눌러 나온 글자를 메모장이나 단톡방에 붙여두세요.</p>
  </section>

  <!-- 학습 -->
  <section id="learn" class="view" hidden>
    <div id="learnIntro" class="intro"></div>
    <div id="card" class="card"></div>
    <div class="pager">
      <button id="prev" class="ghost big">‹</button>
      <span id="pos"></span>
      <button id="next" class="primary big">다음 ›</button>
    </div>
  </section>

  <!-- 퀴즈 -->
  <section id="quiz" class="view" hidden>
    <div id="quizBar" class="bar"><div id="quizFill"></div></div>
    <div id="quizBody"></div>
  </section>

  <!-- 성조 드릴 -->
  <section id="tone" class="view" hidden>
    <div id="toneBody"></div>
  </section>

  <!-- 미션 -->
  <section id="mission" class="view" hidden>
    <div id="missionBody"></div>
  </section>
</main>

<script src="app.js?v=c25b3683"></script>
</body>
</html>
