<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="짜오짜오">
<meta name="mobile-web-app-capable" content="yes">
<title>짜오짜오 — 베트남어</title>
<link rel="stylesheet" href="style.css?v=1410ba1f">
</head>
<body>

<header id="top">
  <button id="back" class="ghost" hidden>‹</button>
  <h1 id="title">짜오짜오</h1>
  <button id="goMe" class="ghost icon" title="내 정보" aria-label="내 정보">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/></svg>
  </button>
  <button id="region" class="ghost" title="북부/남부 소리 전환">북부</button>
  <button id="voice" class="ghost" title="목소리 바꾸기">여</button>
</header>

<main>
  <!-- 홈 -->
  <section id="home" class="view">
    <div id="plan" class="plan"></div>
    <div id="progress" class="progress"></div>
    <div class="menu" id="menu"></div>
    <div class="backup">
      <button id="bkExport" class="ghost">진도 백업</button>
      <button id="bkImport" class="ghost">백업 불러오기</button>
      <button id="bkReset" class="ghost">진도 초기화</button>
    </div>
    <p class="foot small">하루 학습이 끝나면 <b>진도 백업</b>을 한 번 눌러 두세요.</p>
  </section>

  <!-- 학습 -->
  <section id="learn" class="view" hidden>
    <div id="card" class="card"></div>
    <div class="pager">
      <button id="prev" class="ghost big">‹</button>
      <span id="pos"></span>
      <button id="next" class="primary big">다음 ›</button>
    </div>
  </section>

  <!-- 퀴즈 -->
  <section id="quiz" class="view" hidden>
    <div id="quizBar" class="bar"><div id="quizFill"></div></div>
    <div id="quizBody"></div>
  </section>

  <!-- 성조 드릴 -->
  <section id="tone" class="view" hidden>
    <div id="toneBody"></div>
  </section>

  <!-- 규칙 -->
  <section id="rules" class="view" hidden>
    <div id="rulesBody"></div>
  </section>

  <!-- 업적 -->
  <section id="award" class="view" hidden>
    <div id="awardBody"></div>
  </section>

  <!-- 학습 과정 목록 -->
  <section id="course" class="view" hidden>
    <ol id="dayList" class="days"></ol>
  </section>

  <!-- 따라 말하기 -->
  <section id="speak" class="view" hidden>
    <div id="speakBody"></div>
  </section>

  <!-- 자판 -->
  <section id="type" class="view" hidden>
    <div id="typeBody"></div>
  </section>

  <!-- 손글씨 -->
  <section id="write" class="view" hidden>
    <div id="writeBody"></div>
  </section>

  <!-- 베트남 소식 -->
  <section id="news" class="view" hidden>
    <div id="newsBody"></div>
  </section>

  <!-- 날씨 · 시간 -->
  <section id="wx" class="view" hidden>
    <div id="wxBody"></div>
  </section>

  <!-- 사용법 -->
  <section id="guide" class="view" hidden>
    <div id="guideBody"></div>
  </section>

  <!-- 하위 메뉴 -->
  <section id="sub" class="view" hidden>
    <div id="subBody"></div>
  </section>

  <!-- 동아리 -->
  <section id="club" class="view" hidden>
    <div id="clubBody"></div>
  </section>

  <!-- 주간 성적표 -->
  <section id="week" class="view" hidden>
    <div id="weekBody"></div>
  </section>

  <!-- 닉네임 -->
  <section id="nick" class="view" hidden>
    <div id="nickBody"></div>
  </section>

  <!-- AI 대화 -->
  <section id="chat" class="view" hidden>
    <div id="tch" class="tch" hidden></div>
    <div id="chatSetup" hidden></div>
    <div id="chatLog" class="chatlog"></div>
    <form id="chatForm" class="chatin" hidden>
      <button id="chatCam" class="ghost icon" type="button" title="사진 찍어 보여주기" aria-label="사진">
        <svg viewBox="0 0 24 24"><path d="M4 8h3.2l1.4-2h6.8l1.4 2H20a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13.5" r="3.6"/></svg>
      </button>
      <button id="chatMic" class="ghost icon" type="button" title="말로 하기" aria-label="말로">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/></svg>
      </button>
      <div class="tawrap" data-v=""><textarea id="chatText" rows="1" inputmode="none" placeholder="베트남어나 한국어로…" autocomplete="off"></textarea></div>
      <button id="chatKb" class="ghost icon" type="button" title="베트남어 자판" aria-label="자판">
        <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M6 13.5h.01M9.5 13.5h.01M13 13.5h.01M16.5 13.5h.01M8 16.5h8"/></svg>
      </button>
      <button class="primary" type="submit">보내기</button>
    </form>
    <div id="chatKeys" class="vkb chatkb" hidden></div>
  </section>
</main>

<script src="pitch.js?v=1410ba1f"></script>
<script src="app.js?v=1410ba1f"></script>
</body>
</html>
