<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../style.css">
<style>
body{background:#fff;margin:0;padding:12px;font-family:system-ui}
.grid{display:grid;grid-template-columns:repeat(6,200px);gap:8px}
.cell{text-align:center;font-size:13px;color:#555}
.petfig{width:200px;height:200px;background:#F3F5F8;border-radius:16px;display:inline-flex}
.snap.hop .pt-wing{animation-play-state:paused!important;animation-delay:-.17s!important}
.snap.eat .pt-head,.snap.eat .pt-beakb,.snap.eat .pt-food{animation-play-state:paused!important;animation-delay:-.45s!important}
.snap.hatch .pt-eggtop,.snap.hatch .pt-chick{animation-play-state:paused!important;animation-delay:-1.6s!important}
.snap.crack .pt-crack{animation-play-state:paused!important;animation-delay:-.9s!important}
.snap .pt-body,.snap .pt-lid,.snap .pt-crest,.snap .pt-tail{animation-play-state:paused;animation-delay:-1s}
</style></head><body>
<div id="g" class="grid"></div>
<script src="../pet.js"></script>
<script>
const g=document.getElementById('g');
const cell=(html,label,cls)=>{const d=document.createElement('div');d.className='cell';d.innerHTML='<div class="petfig snap '+(cls||'')+'">'+html+'</div><div>'+label+'</div>';g.append(d);};
cell(petSvg(4,'chao'),'짜오(아이콘 새)');
for(let s=1;s<6;s++) cell(petSvg(s,'cockatiel'),'왕관앵무 '+s+'단계');
cell(petSvg(4,'cockatiel'),'톡: 날갯짓','hop');
cell(petSvg(4,'cockatiel',{food:'banana'}),'먹기(바나나)','eat');
cell(petSvg(4,'cockatiel'),'웃기','laugh');
cell(petSvg(4,'cockatiel'),'자기','sleep');
cell(petSvg(2,'cockatiel',{hatch:true}),'깨는 중','hatch');
cell(petSvg(0,'cockatiel'),'알');
['quaker','conure','grey','macawblue','macawred'].forEach(k=>cell(petSvg(4,k),PET_SPECIES[k].name+' '+PET_SPECIES[k].price+'동'));
cell(petSvg(3,'quaker'),'퀘이커 어린');
['quaker','conure','grey','macawblue','macawred'].forEach(k=>cell(petSvg(2,k),PET_SPECIES[k].name+' 아기'));
cell(petSvg(2,'chao'),'짜오 아기');
</script></body></html>
