name: 오늘의 기사
on:
  schedule:
    # 한국 저녁 7시 30분. 기사 사이트가 오전 9시~오후 6시에 올리므로
    # 아침에 돌리면 '오늘 기사'가 하나도 없어서 늘 어제 것만 잡힌다.
    - cron: '30 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ① 기사 고르기 — 우리 관심사(공장·임금·비자…)가 첫 기준. 하루 2개.
      - run: python3 tools/fetch_news.py

      # ② 그중 1등 기사로 '오늘의 기사' 학습 세트 만들기 (요약 2줄 + 단어 10 + 문장 2)
      #    GEMINI_KEY 가 저장소 Secrets 에 없으면 이 단계는 조용히 건너뛴다.
      - run: python3 tools/news_lesson.py
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}

      # ③ 새 단어·문장의 북부 음성 만들기 (edge-tts, 무료·키 불필요)
      #    남부 음성과 그림은 개발자 맥에서만 만들 수 있어 여기서는 건너뛴다.
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet edge-tts
      - run: python3 tools/news_audio.py
        continue-on-error: true

      # ④ 판번호를 새로 찍어야 폰의 캐시가 새 세트를 받는다
      - run: python3 tools/stamp.py

      - run: |
          git config user.name news-bot
          git config user.email actions@users.noreply.github.com
          git add data/ audio/ index.html sw.js
          git diff --cached --quiet || { git commit -m "오늘의 기사·학습 세트 자동 갱신" && git push; }
